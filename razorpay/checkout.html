<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MerchantOps AI - Razorpay Test</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
        }

        input {
            padding: 12px;
            width: 220px;
            font-size: 16px;
            margin: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

    </style>

</head>


<body>

    <h1>💳 MerchantOps AI</h1>

    <p>
        Razorpay Test Mode Payment
    </p>

    <label for="amount">
        Amount (₹):
    </label>

    <br>

    <input
        id="amount"
        type="number"
        value="500"
        min="1"
        step="1"
    >

    <br>

    <button
        id="pay-button"
        type="button"
    >
        Create Test Payment
    </button>

    <div id="status">
        Ready.
    </div>


    <script>

        // ========================================================
        // CONFIGURATION
        // ========================================================

        /*
         * IMPORTANT:
         * This is your CURRENT zrok public URL.
         *
         * If you restart zrok and receive a different hostname,
         * change ONLY this value.
         */
        const API_BASE_URL =
        "http://127.0.0.1:8000";


        /*
         * Razorpay TEST Key ID.
         *
         * This is a public key and can be used in frontend code.
         *
         * NEVER put your Razorpay Key Secret here.
         * NEVER put your Webhook Secret here.
         */
        const RAZORPAY_KEY_ID =
            "rzp_test_TV7feaaiM2EsjP";


        // ========================================================
        // ELEMENTS
        // ========================================================

        const statusElement =
            document.getElementById(
                "status"
            );

        const payButton =
            document.getElementById(
                "pay-button"
            );


        // ========================================================
        // STATUS HELPER
        // ========================================================

        function setStatus(
            message
        ) {

            statusElement.textContent =
                message;

        }


        // ========================================================
        // CREATE PAYMENT
        // ========================================================

        payButton.addEventListener(
            "click",
            async function () {

                try {

                    setStatus(
                        "Creating Razorpay order..."
                    );


                    // ------------------------------------------------
                    // Read amount from input
                    // ------------------------------------------------

                    const amount =
                        Number(
                            document
                                .getElementById(
                                    "amount"
                                )
                                .value
                        );


                    if (
                        !Number.isFinite(
                            amount
                        )
                        || amount <= 0
                    ) {

                        throw new Error(
                            "Enter a valid amount."
                        );

                    }


                    // ------------------------------------------------
                    // Convert rupees to paise
                    // Example:
                    //
                    // ₹500
                    // ↓
                    // 50000 paise
                    // ------------------------------------------------

                    const amountInPaise =
                        Math.round(
                            amount * 100
                        );


                    // ------------------------------------------------
                    // Create Razorpay Order
                    //
                    // IMPORTANT:
                    // This is a POST request.
                    // ------------------------------------------------

                    const orderUrl =
                        API_BASE_URL
                        + "/razorpay/create-order"
                        + "?amount="
                        + encodeURIComponent(
                            amountInPaise
                        );


                    console.log(
                        "Creating order:",
                        orderUrl
                    );


                    const orderResponse =
                        await fetch(
                            orderUrl,
                            {
                                method: "POST",

                                headers: {
                                    "Accept":
                                        "application/json"
                                }
                            }
                        );


                    // ------------------------------------------------
                    // Check response
                    // ------------------------------------------------

                    if (
                        !orderResponse.ok
                    ) {

                        const errorText =
                            await orderResponse.text();

                        throw new Error(
                            "Order creation failed.\n"
                            + "HTTP Status: "
                            + orderResponse.status
                            + "\n"
                            + errorText
                        );

                    }


                    // ------------------------------------------------
                    // Read order response
                    // ------------------------------------------------

                    const order =
                        await orderResponse.json();


                    console.log(
                        "Razorpay order:",
                        order
                    );


                    if (
                        !order.order_id
                    ) {

                        throw new Error(
                            "FastAPI did not return an order_id."
                        );

                    }


                    setStatus(
                        "Order created: "
                        + order.order_id
                        + "\nOpening Razorpay Checkout..."
                    );


                    // =================================================
                    // RAZORPAY CHECKOUT OPTIONS
                    // =================================================

                    const options = {

                        // ------------------------------------------------
                        // Test Key ID
                        // ------------------------------------------------

                        key:
                            RAZORPAY_KEY_ID,


                        // ------------------------------------------------
                        // Amount from Razorpay Order
                        // ------------------------------------------------

                        amount:
                            order.amount,


                        // ------------------------------------------------
                        // Currency
                        // ------------------------------------------------

                        currency:
                            order.currency,


                        // ------------------------------------------------
                        // Merchant information
                        // ------------------------------------------------

                        name:
                            "MerchantOps AI",

                        description:
                            "MerchantOps AI Test Payment",


                        // ------------------------------------------------
                        // IMPORTANT:
                        // Use the server-created order ID
                        // ------------------------------------------------

                        order_id:
                            order.order_id,


                        // ------------------------------------------------
                        // SUCCESS
                        // ------------------------------------------------

                        handler:
                            function (
                                response
                            ) {

                                console.log(
                                    "Payment successful:",
                                    response
                                );


                                setStatus(
                                    "✅ Payment successful!\n\n"
                                    + "Payment ID: "
                                    + response
                                        .razorpay_payment_id
                                    + "\n"
                                    + "Order ID: "
                                    + response
                                        .razorpay_order_id
                                    + "\n\n"
                                    + "MerchantOps can now "
                                    + "retrieve this payment "
                                    + "from Razorpay."
                                );

                            },


                        // ------------------------------------------------
                        // CUSTOMER PREFILL
                        // ------------------------------------------------

                        prefill: {

                            name:
                                "MerchantOps Test User",

                            email:
                                "test@example.com",

                            contact:
                                "9999999999"

                        },


                        // ------------------------------------------------
                        // NOTES
                        // ------------------------------------------------

                        notes: {

                            source:
                                "merchantops_ai_test"

                        },


                        // ------------------------------------------------
                        // THEME
                        // ------------------------------------------------

                        theme: {

                            color:
                                "#3399cc"

                        }

                    };


                    // =================================================
                    // INITIALIZE RAZORPAY
                    // =================================================

                    const razorpay =
                        new Razorpay(
                            options
                        );


                    // =================================================
                    // FAILURE EVENT
                    // =================================================

                    razorpay.on(
                        "payment.failed",
                        function (
                            response
                        ) {

                            console.error(
                                "Payment failed:",
                                response
                            );


                            const error =
                                response.error
                                || {};


                            setStatus(
                                "❌ Payment failed.\n\n"
                                + "Code: "
                                + (
                                    error.code
                                    || "Unknown"
                                )
                                + "\n"
                                + "Description: "
                                + (
                                    error.description
                                    || "Unknown"
                                )
                                + "\n"
                                + "Source: "
                                + (
                                    error.source
                                    || "Unknown"
                                )
                                + "\n"
                                + "Step: "
                                + (
                                    error.step
                                    || "Unknown"
                                )
                                + "\n"
                                + "Reason: "
                                + (
                                    error.reason
                                    || "Unknown"
                                )
                            );

                        }
                    );


                    // =================================================
                    // OPEN CHECKOUT
                    // =================================================

                    razorpay.open();

                }

                catch (
                    error
                ) {

                    console.error(
                        "Checkout error:",
                        error
                    );


                    setStatus(
                        "❌ Error:\n"
                        + (
                            error.message
                            || String(error)
                        )
                    );

                }

            }
        );

    </script>

</body>

</html>
