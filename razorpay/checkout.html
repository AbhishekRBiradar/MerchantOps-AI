<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MerchantOps AI - Razorpay Test</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
        }

        input {
            padding: 12px;
            width: 220px;
            font-size: 16px;
            margin: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

    </style>

</head>


<body>

    <h1>💳 MerchantOps AI</h1>

    <p>
        Razorpay Test Mode Payment
    </p>

    <label for="amount">
        Amount (₹):
    </label>

    <br>

    <input
        id="amount"
        type="number"
        value="500"
        min="1"
        step="1"
    >

    <br>

    <button
        id="pay-button"
        type="button"
    >
        Create Test Payment
    </button>

    <div id="status">
        Ready.
    </div>


    <script>

        // ========================================================
        // CONFIGURATION
        // ========================================================

        /*
         * Checkout is served locally on port 5500.
         * Order creation and payment verification are handled
         * by the local FastAPI backend on port 8000.
         */

        const API_BASE_URL =
            "http://127.0.0.1:8000";


        /*
         * Razorpay TEST Key ID.
         *
         * This is a public frontend key.
         *
         * NEVER put the following here:
         * - RAZORPAY_KEY_SECRET
         * - RAZORPAY_WEBHOOK_SECRET
         */

        const RAZORPAY_KEY_ID =
            "rzp_test_TV7feaaiM2EsjP";


        // ========================================================
        // PAGE ELEMENTS
        // ========================================================

        const statusElement =
            document.getElementById(
                "status"
            );

        const payButton =
            document.getElementById(
                "pay-button"
            );


        // ========================================================
        // STATUS HELPER
        // ========================================================

        function setStatus(
            message
        ) {

            statusElement.textContent =
                message;

        }


        // ========================================================
        // VERIFY PAYMENT WITH BACKEND
        // ========================================================

        async function verifyPayment(
            paymentResponse
        ) {

            setStatus(
                "Payment successful.\n"
                + "Verifying payment with MerchantOps..."
            );


            const verificationResponse =
                await fetch(
                    API_BASE_URL
                    + "/razorpay/verify-payment",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        body: JSON.stringify({

                            razorpay_order_id:
                                paymentResponse
                                    .razorpay_order_id,

                            razorpay_payment_id:
                                paymentResponse
                                    .razorpay_payment_id,

                            razorpay_signature:
                                paymentResponse
                                    .razorpay_signature

                        })
                    }
                );


            const result =
                await verificationResponse.json();


            if (
                !verificationResponse.ok
            ) {

                throw new Error(
                    "Verification API failed.\n"
                    + "HTTP Status: "
                    + verificationResponse.status
                    + "\n"
                    + JSON.stringify(
                        result,
                        null,
                        2
                    )
                );

            }


            if (
                result.verified !== true
            ) {

                throw new Error(
                    "Payment signature verification failed."
                );

            }


            return result;

        }


        // ========================================================
        // CREATE PAYMENT
        // ========================================================

        payButton.addEventListener(
            "click",
            async function () {

                try {

                    setStatus(
                        "Creating Razorpay order..."
                    );


                    // ------------------------------------------------
                    // Read amount
                    // ------------------------------------------------

                    const amount =
                        Number(
                            document
                                .getElementById(
                                    "amount"
                                )
                                .value
                        );


                    if (
                        !Number.isFinite(
                            amount
                        )
                        || amount <= 0
                    ) {

                        throw new Error(
                            "Enter a valid amount."
                        );

                    }


                    // ------------------------------------------------
                    // Convert rupees to paise
                    // ------------------------------------------------

                    const amountInPaise =
                        Math.round(
                            amount * 100
                        );


                    // ------------------------------------------------
                    // Create Razorpay Order
                    // ------------------------------------------------

                    const orderUrl =
                        API_BASE_URL
                        + "/razorpay/create-order"
                        + "?amount="
                        + encodeURIComponent(
                            amountInPaise
                        );


                    console.log(
                        "Creating Razorpay order:",
                        orderUrl
                    );


                    const orderResponse =
                        await fetch(
                            orderUrl,
                            {
                                method: "POST",

                                headers: {
                                    "Accept":
                                        "application/json"
                                }
                            }
                        );


                    // ------------------------------------------------
                    // Check order response
                    // ------------------------------------------------

                    if (
                        !orderResponse.ok
                    ) {

                        const errorText =
                            await orderResponse.text();

                        throw new Error(
                            "Order creation failed.\n"
                            + "HTTP Status: "
                            + orderResponse.status
                            + "\n"
                            + errorText
                        );

                    }


                    const order =
                        await orderResponse.json();


                    console.log(
                        "Razorpay order:",
                        order
                    );


                    if (
                        !order.order_id
                    ) {

                        throw new Error(
                            "FastAPI did not return an order_id."
                        );

                    }


                    setStatus(
                        "Order created: "
                        + order.order_id
                        + "\nOpening Razorpay Checkout..."
                    );


                    // =================================================
                    // RAZORPAY CHECKOUT OPTIONS
                    // =================================================

                    const options = {

                        // ------------------------------------------------
                        // TEST KEY
                        // ------------------------------------------------

                        key:
                            RAZORPAY_KEY_ID,


                        // ------------------------------------------------
                        // ORDER DETAILS
                        // ------------------------------------------------

                        amount:
                            order.amount,

                        currency:
                            order.currency,

                        name:
                            "MerchantOps AI",

                        description:
                            "MerchantOps AI Test Payment",

                        order_id:
                            order.order_id,


                        // ------------------------------------------------
                        // SUCCESS HANDLER
                        // ------------------------------------------------

                        handler:
                            async function (
                                response
                            ) {

                                console.log(
                                    "Razorpay success response:",
                                    response
                                );


                                try {

                                    /*
                                     * Do not trust only the client-side
                                     * success message.
                                     *
                                     * Send all Razorpay response values
                                     * to the backend for verification.
                                     */

                                    const verification =
                                        await verifyPayment(
                                            response
                                        );


                                    // ------------------------------------
                                    // New backend response structure
                                    // ------------------------------------

                                    const payment =
                                        verification.payment;


                                    if (
                                        !payment
                                    ) {

                                        throw new Error(
                                            "Backend did not return "
                                            + "verified payment details."
                                        );

                                    }


                                    setStatus(
                                        "✅ Payment verified successfully!\n\n"
                                        + "Payment ID: "
                                        + (
                                            payment.payment_id
                                            || "Unknown"
                                        )
                                        + "\n"
                                        + "Order ID: "
                                        + (
                                            payment.order_id
                                            || "Unknown"
                                        )
                                        + "\n"
                                        + "Amount: ₹"
                                        + (
                                            payment.amount
                                            ?? "Unknown"
                                        )
                                        + "\n"
                                        + "Currency: "
                                        + (
                                            payment.currency
                                            || "Unknown"
                                        )
                                        + "\n"
                                        + "Method: "
                                        + (
                                            payment.payment_method
                                            || "Unknown"
                                        )
                                        + "\n"
                                        + "Payment Status: "
                                        + (
                                            payment.payment_status
                                            || "Unknown"
                                        )
                                        + "\n"
                                        + "Captured: "
                                        + (
                                            payment.captured
                                            ? "Yes"
                                            : "No"
                                        )
                                        + "\n"
                                        + "Backend Status: "
                                        + (
                                            verification.status
                                            || "verified"
                                        )
                                    );

                                }

                                catch (
                                    verificationError
                                ) {

                                    console.error(
                                        "Verification error:",
                                        verificationError
                                    );


                                    setStatus(
                                        "⚠️ Payment completed, "
                                        + "but backend verification failed.\n\n"
                                        + (
                                            verificationError.message
                                            || String(
                                                verificationError
                                            )
                                        )
                                    );

                                }

                            },


                        // ------------------------------------------------
                        // CUSTOMER PREFILL
                        // ------------------------------------------------

                        prefill: {

                            name:
                                "MerchantOps Test User",

                            email:
                                "test@example.com",

                            contact:
                                "9999999999"

                        },


                        // ------------------------------------------------
                        // NOTES
                        // ------------------------------------------------

                        notes: {

                            source:
                                "merchantops_ai_test"

                        },


                        // ------------------------------------------------
                        // THEME
                        // ------------------------------------------------

                        theme: {

                            color:
                                "#3399cc"

                        }

                    };


                    // =================================================
                    // CREATE RAZORPAY INSTANCE
                    // =================================================

                    const razorpay =
                        new Razorpay(
                            options
                        );


                    // =================================================
                    // PAYMENT FAILURE EVENT
                    // =================================================

                    razorpay.on(
                        "payment.failed",
                        function (
                            response
                        ) {

                            console.error(
                                "Payment failed:",
                                response
                            );


                            const error =
                                response.error
                                || {};


                            setStatus(
                                "❌ Payment failed.\n\n"
                                + "Code: "
                                + (
                                    error.code
                                    || "Unknown"
                                )
                                + "\n"
                                + "Description: "
                                + (
                                    error.description
                                    || "Unknown"
                                )
                                + "\n"
                                + "Source: "
                                + (
                                    error.source
                                    || "Unknown"
                                )
                                + "\n"
                                + "Step: "
                                + (
                                    error.step
                                    || "Unknown"
                                )
                                + "\n"
                                + "Reason: "
                                + (
                                    error.reason
                                    || "Unknown"
                                )
                            );

                        }
                    );


                    // =================================================
                    // OPEN RAZORPAY CHECKOUT
                    // =================================================

                    razorpay.open();

                }

                catch (
                    error
                ) {

                    console.error(
                        "Checkout error:",
                        error
                    );


                    setStatus(
                        "❌ Error:\n"
                        + (
                            error.message
                            || String(error)
                        )
                    );

                }

            }
        );

    </script>

</body>

</html>
