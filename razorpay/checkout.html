<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MerchantOps AI - Razorpay Checkout</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b
                );

            color: #f8fafc;
        }

        .container {
            width: min(
                92%,
                520px
            );

            padding: 32px;

            border-radius: 20px;

            background:
                rgba(
                    15,
                    23,
                    42,
                    0.92
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

            box-shadow:
                0 24px 70px
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;

            font-size: 32px;
        }

        .subtitle {
            margin-bottom: 28px;

            color:
                #cbd5e1;

            line-height: 1.5;
        }

        label {
            display: block;

            margin-top: 16px;
            margin-bottom: 7px;

            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border-radius: 10px;

            border:
                1px solid
                #475569;

            background:
                #0f172a;

            color:
                #f8fafc;

            outline: none;
        }

        input:focus {
            border-color:
                #94a3b8;
        }

        button {
            width: 100%;

            margin-top: 24px;

            padding: 14px 18px;

            border: 0;

            border-radius: 10px;

            background:
                #2563eb;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.92;
        }

        button:disabled {
            opacity: 0.55;

            cursor: not-allowed;
        }

        .status {
            display: none;

            margin-top: 22px;

            padding: 16px;

            border-radius: 12px;

            line-height: 1.6;

            white-space: pre-wrap;
        }

        .success {
            display: block;

            background:
                rgba(
                    22,
                    163,
                    74,
                    0.15
                );

            border:
                1px solid
                rgba(
                    74,
                    222,
                    128,
                    0.35
                );
        }

        .error {
            display: block;

            background:
                rgba(
                    220,
                    38,
                    38,
                    0.15
                );

            border:
                1px solid
                rgba(
                    248,
                    113,
                    113,
                    0.35
                );
        }

        .loading {
            display: block;

            background:
                rgba(
                    59,
                    130,
                    246,
                    0.15
                );

            border:
                1px solid
                rgba(
                    147,
                    197,
                    253,
                    0.35
                );
        }

        .small {
            margin-top: 18px;

            color:
                #94a3b8;

            font-size: 13px;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>💳 MerchantOps AI</h1>

    <div class="subtitle">
        Razorpay Test Mode checkout with
        server-side payment verification.
    </div>

    <label for="amount">
        Amount (₹)
    </label>

    <input
        id="amount"
        type="number"
        value="500"
        min="1"
        step="1"
    >

    <label for="customerName">
        Customer Name
    </label>

    <input
        id="customerName"
        type="text"
        value="Test Customer"
    >

    <label for="customerEmail">
        Email
    </label>

    <input
        id="customerEmail"
        type="email"
        value="test@example.com"
    >

    <label for="customerContact">
        Contact Number
    </label>

    <input
        id="customerContact"
        type="tel"
        value="8618293429"
    >

    <button
        id="payButton"
        onclick="startPayment()"
    >
        Pay ₹500
    </button>

    <div
        id="status"
        class="status"
    ></div>

    <div class="small">
        Razorpay Test Mode • MerchantOps AI
    </div>

</div>


<script>

    // ========================================================
    // API CONFIGURATION
    // ========================================================

    const API_URL =
        "https://merchantops-ai-api.onrender.com";


    // ========================================================
    // DOM HELPERS
    // ========================================================

    const payButton =
        document.getElementById(
            "payButton"
        );

    const statusBox =
        document.getElementById(
            "status"
        );


    function setStatus(
        message,
        type
    ) {

        statusBox.className =
            "status " + type;

        statusBox.textContent =
            message;

    }


    // ========================================================
    // CREATE ORDER
    // ========================================================

    async function createOrder(
        amountPaise
    ) {

        const response =
            await fetch(
                `${API_URL}/razorpay/create-order?amount=${amountPaise}`,
                {
                    method: "POST"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Unable to create Razorpay order."
            );

        }

        return data;

    }


    // ========================================================
    // VERIFY PAYMENT
    // ========================================================

    async function verifyPayment(
        paymentResponse
    ) {

        const response =
            await fetch(
                `${API_URL}/razorpay/verify-payment`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            razorpay_order_id:
                                paymentResponse.razorpay_order_id,

                            razorpay_payment_id:
                                paymentResponse.razorpay_payment_id,

                            razorpay_signature:
                                paymentResponse.razorpay_signature

                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Payment verification request failed."
            );

        }

        return data;

    }


    // ========================================================
    // START PAYMENT
    // ========================================================

    async function startPayment() {

        try {

            payButton.disabled =
                true;

            setStatus(
                "Creating Razorpay order...",
                "loading"
            );


            // ------------------------------------------------
            // Get customer values
            // ------------------------------------------------

            const amountRupees =
                Number(
                    document.getElementById(
                        "amount"
                    ).value
                );

            const customerName =
                document.getElementById(
                    "customerName"
                ).value
                || "Test Customer";

            const customerEmail =
                document.getElementById(
                    "customerEmail"
                ).value
                || "test@example.com";

            const customerContact =
                document.getElementById(
                    "customerContact"
                ).value
                || "8618293429";


            // ------------------------------------------------
            // Validate amount
            // ------------------------------------------------

            if (
                !Number.isFinite(
                    amountRupees
                )
                ||
                amountRupees <= 0
            ) {

                throw new Error(
                    "Please enter a valid amount."
                );

            }


            const amountPaise =
                Math.round(
                    amountRupees * 100
                );


            // ------------------------------------------------
            // Create backend Razorpay order
            // ------------------------------------------------

            const order =
                await createOrder(
                    amountPaise
                );


            setStatus(
                "Opening Razorpay Checkout...",
                "loading"
            );


            // ------------------------------------------------
            // Razorpay options
            // ------------------------------------------------

            const options = {

                key:
                    "rzp_test_TV7feaaiM2EsjP",

                amount:
                    order.amount,

                currency:
                    order.currency,

                name:
                    "MerchantOps AI",

                description:
                    "MerchantOps AI Test Payment",

                order_id:
                    order.order_id,

                prefill: {

                    name:
                        customerName,

                    email:
                        customerEmail,

                    contact:
                        customerContact

                },

                notes: {

                    source:
                        "merchantops_ai_test"

                },


                // --------------------------------------------
                // SUCCESS HANDLER
                // --------------------------------------------

                handler:
                    async function (
                        razorpayResponse
                    ) {

                        console.log(
                            "Razorpay success response:",
                            razorpayResponse
                        );


                        setStatus(
                            "Payment received.\n" +
                            "Verifying payment with MerchantOps AI...",
                            "loading"
                        );


                        try {

                            // --------------------------------
                            // IMPORTANT:
                            // Send Razorpay response to
                            // production FastAPI.
                            // --------------------------------

                            const verification =
                                await verifyPayment(
                                    razorpayResponse
                                );


                            console.log(
                                "MerchantOps verification response:",
                                verification
                            );


                            if (
                                verification.verified
                                !== true
                            ) {

                                throw new Error(
                                    verification.reason ||
                                    "Payment verification failed."
                                );

                            }


                            // --------------------------------
                            // Display successful result
                            // --------------------------------

                            const payment =
                                verification.payment
                                || {};


                            setStatus(

                                "✅ Payment verified successfully!\n\n"
                                +

                                "Payment ID: "
                                +
                                (
                                    payment.payment_id
                                    || "-"
                                )
                                +

                                "\nOrder ID: "
                                +
                                (
                                    payment.order_id
                                    || "-"
                                )
                                +

                                "\nAmount: ₹"
                                +
                                (
                                    payment.amount
                                    ?? "-"
                                )
                                +

                                "\nPayment Status: "
                                +
                                (
                                    payment.payment_status
                                    || "-"
                                )
                                +

                                "\nCaptured: "
                                +
                                (
                                    payment.captured
                                    ? "Yes"
                                    : "No"
                                )
                                +

                                "\n\nBackend Status: "
                                +
                                verification.status
                                +

                                "\nAudit Recorded: "
                                +
                                (
                                    verification.audit_recorded
                                    ? "Yes"
                                    : "No"
                                )
                                +

                                "\nAudit Storage: "
                                +
                                (
                                    verification.audit_storage
                                    || "-"
                                ),

                                "success"
                            );


                        }
                        catch (
                            verificationError
                        ) {

                            console.error(
                                "Verification error:",
                                verificationError
                            );


                            setStatus(

                                "❌ Payment succeeded, "
                                + 
                                "but backend verification failed.\n\n"
                                +
                                verificationError.message,

                                "error"
                            );

                        }
                        finally {

                            payButton.disabled =
                                false;

                        }

                    },


                // --------------------------------------------
                // MODAL CLOSE
                // --------------------------------------------

                modal:
                    {
                        ondismiss:
                            function () {

                                payButton.disabled =
                                    false;

                                setStatus(
                                    "Checkout closed.",
                                    "loading"
                                );

                            }
                    }

            };


            // ------------------------------------------------
            // Open Razorpay
            // ------------------------------------------------

            const razorpay =
                new Razorpay(
                    options
                );


            razorpay.on(
                "payment.failed",
                function (
                    response
                ) {

                    console.error(
                        "Razorpay payment failed:",
                        response.error
                    );


                    setStatus(

                        "❌ Payment failed.\n\n"
                        +
                        "Reason: "
                        +
                        (
                            response.error
                            ?.description
                            ||
                            "Payment failed."
                        )
                        +
                        "\nCode: "
                        +
                        (
                            response.error
                            ?.code
                            ||
                            "-"
                        ),

                        "error"
                    );


                    payButton.disabled =
                        false;

                }
            );


            razorpay.open();

        }
        catch (
            error
        ) {

            console.error(
                "Payment initialization error:",
                error
            );


            setStatus(
                "❌ " +
                error.message,
                "error"
            );


            payButton.disabled =
                false;

        }

    }

</script>

</body>
</html>
